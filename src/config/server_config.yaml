comm_config:
  discovery_type: grpc  # "mqtt" or "grpc" — controls client discovery/heartbeat mechanism
  common:
    heartbeat_interval_s: 10
    num_heartbeats_timestamp_cached: 10
    max_heartbeat_miss_threshold: 3
  mqtt_discovery:
    type: server
    broker_host: 10.24.24.32
    broker_port: 1882
    mqtt_sub_timeout_s: 10
    mqtt_server_topic: advert_server
    mqtt_client_topic: advert_client
  grpc_discovery:  # used when discovery_type is "grpc"
    port: 50051
  grpc_runtime:
    max_message_length: 1048576000 # (1000*1024*1024)
    chunk_size_bytes: 1024
    timeout_s: 1200000
  restful:
    host: 0.0.0.0
    port: 12345
state:
  state_location: redis  # "ukv" , "redis", or "inmemory"
  state_hostname: 127.0.0.1   # local redis-server (bound to loopback; not exposed publicly)
  state_port: 6379  # only used  by redis
checkpoint_dir_path: ./checkpoint
validation_data_dir_path: /home/azureuserfl/fl_flow/fedml-ng-release-v1.0/src/val_data
temp_dir_path: ./scratch  
